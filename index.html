<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h2>Student Registration Form </h2>

    <fieldset>
        <legend>Persanal information</legend>

        <p>
            <label for=""> Full name:</label>
            <input type="text" placeholder="user name" />
        </p>
        <p>
            <Label>Email:</Label>
            <input type="email">
        </p>
        <p>
            <Label>Password:</Label>
            <input type="password">
        </p>
        <p>
           <Label> Gender:</Label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <input type="radio" name="Gender">Other
        </p>

        <p>
            <Label>Date of Birth:</Label>
            <input type="date">
        </p>
        <p>
           <Label> Phone:</Label>
            <input type="text">
        </p>


    </fieldset>

    <fieldset>
        <legend>Academic information</legend>
        <p>
            <label for="">Student ID:</label>
            <input type="Student ID">
        </p>
        <p>
            <label for="">Major:</label>
            <input type="text" placeholder="Select Major">
        </p>
        <p>
            <label for="">Skills:</label>
            <input type="checkbox">HTML
            <input type="checkbox">CSS
            <input type="checkbox">JavaScript
        </p>
        <p>
            <label for="">Upload Photo:</label>
            <input type="file">
        </p>
    </fieldset>

    <fieldset>
        <legend>Additional information</legend>
        <label for="">Address:</label>
        <br>
        <textarea name="" id=""></textarea>
        <p>
            <label for="">Persanal Website:</label>
            <input type="text">
        </p>
        <p>
            <label for="">Favorite Color:</label>
            <input type="color">
        </p>
    </fieldset>

    <P>
        <input type="checkbox">
        <label for="">I agree to the registration terms</label>
    </P>
    <p>
    <button 
    ><a href="studendcard.html">Register</a>
</button>
    <button type="reset">Clear Form</button>
    </p>
</body>

</html>
